<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta e Balanço</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #1e88e5;
            --primary-dark: #1565c0;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .app-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
        }

        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .auth-card {
            background: #fff;
            padding: 2rem;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .auth-card input, .auth-card select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        .auth-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-card button:hover { background: var(--primary-dark); }
        .auth-error { color: #d32f2f; margin-top: 10px; display: none; font-size: 14px; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .header-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .loja-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .loja-controls input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .loja-controls .full-width {
            grid-column: span 2;
        }
        .btn-action {
            padding: 10px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-action:hover { background: var(--primary-dark); }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e0e0e0;
            color: #555;
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
        }
        .nav-btn.active {
            background: var(--primary);
            color: white;
        }

        .scanner-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .reader-box { width: 100%; min-height: 200px; margin-bottom: 10px; }
        .manual-input-box {
            display: flex;
            gap: 10px;
        }
        .manual-input-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .result-box {
            padding: 15px;
            border-radius: var(--border-radius);
            margin-top: 15px;
            display: none;
        }
        .result-box.found { background: #e8f5e9; border: 1px solid #c8e6c9; }
        .result-box.not-found { background: #ffebee; border: 1px solid #ffcdd2; }
        .product-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .product-code { font-size: 14px; color: #666; margin-bottom: 10px; }

        .preco-cadastro-destaque {
            font-size: 16px;
            color: #333;
            margin: 6px 0;
        }
        .preco-promocional-vermelho {
            color: #d32f2f;
            font-weight: bold;
            font-size: 20px;
            margin-top: 6px;
            margin-bottom: 10px;
        }

        .status-promocao {
            padding: 12px;
            border-radius: var(--border-radius);
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
        .status-promocao-em { 
            background: #ffebee; 
            border: 2px solid #ef5350; 
            color: #c62828; 
            font-size: 20px;
        }
        .status-promocao-fora { 
            background: #e9ecef; 
            border: 1px solid #ced4da; 
            color: #495057; 
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.2fr 0.8fr;
            gap: 10px;
            margin-top: 15px;
            align-items: end;
        }
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            min-height: 28px;
            display: flex;
            align-items: flex-end;
        }
        .form-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            width: 100%;
        }

        .estoque-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .estoque-item {
            background: rgba(255,255,255,0.6);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .estoque-item small { display: block; color: #666; font-size: 11px; }

        .btn-danger { background: #d32f2f; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d32; }
        .btn-warning { background: #f57c00; color: white; }
        .btn-warning:hover { background: #e65100; }
        .btn-full { width: 100%; margin-top: 10px; }

        :root {
            --primary:#0b5275; --primary-dark:#073b56; --accent:#16a6ad;
            --bg-color:#f3f6f9; --card-bg:#ffffff; --text-color:#172b3a;
            --border-radius:16px;
        }
        body { background:linear-gradient(135deg,#eef3f7 0%,#f8fafc 100%); }
        .container { max-width:1050px; padding:clamp(12px,3vw,28px); }
        .auth-card,.header-card,.scanner-card,.result-box {
            border-radius:20px; box-shadow:0 12px 35px rgba(15,45,65,.09);
        }
        .auth-card { padding:clamp(20px,4vw,34px); }
        .app-logo { max-width:190px; border-radius:12px; }
        input,select { min-height:46px; border:1px solid #d5dee7!important; border-radius:10px!important; font:inherit; }
        input:focus,select:focus { outline:3px solid rgba(22,166,173,.18); border-color:var(--accent)!important; }
        button { font:inherit; font-weight:700; cursor:pointer; transition:transform .15s, box-shadow .15s, background .15s; }
        button:hover { transform:translateY(-1px); box-shadow:0 6px 15px rgba(10,45,65,.12); }
        button:disabled { opacity:.65; cursor:wait; }
        .btn-action,.nav-btn,.auth-card button,.mode-btn {
            border:0; border-radius:14px; background:var(--primary); color:#fff;
            aspect-ratio:1 / 1; width:100%; max-width:145px; min-width:86px; min-height:86px;
            padding:12px; display:inline-flex; align-items:center; justify-content:center;
            text-align:center; white-space:normal; overflow-wrap:anywhere; line-height:1.2;
        }
        .auth-card button { margin:14px auto 0; background:linear-gradient(145deg,var(--primary),var(--accent)); }
        .btn-action:hover,.nav-btn:hover,.mode-btn:hover { background:var(--primary-dark); }
        .btn-success { background:#16806a!important; } .btn-danger { background:#b93846!important; }
        .btn-warning { background:#b7791f!important; }
        .nav-tabs { display:none; }
        .loja-controls { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); align-items:center; }
        .loja-controls .full-width { grid-column:auto; }
        .header-card { padding:18px; }
        .manual-input-box { align-items:stretch; }
        .manual-input-box input { min-width:0; }
        .form-grid { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; }
        .form-group label { min-height:auto; font-size:13px; color:#3b5364; }
        .form-group input { min-height:44px; }
        .reader-box { overflow:hidden; border-radius:12px; background:#f7fafc; }
        #reader-promocao,#reader-balanco { border:0!important; }
        #reader-promocao button,#reader-balanco button { width:auto; max-width:none; min-width:0; min-height:40px; aspect-ratio:auto; border-radius:8px; }
        .result-box { padding:18px; }
        .estoque-item { border-radius:10px; padding:12px; }
        #menu-overlay {
            position:fixed; inset:0; z-index:9997; display:none; align-items:center; justify-content:center;
            padding:20px; background:rgba(8,28,43,.72); backdrop-filter:blur(5px);
        }
        .menu-card { width:min(760px,100%); background:white; padding:clamp(20px,4vw,36px);
            border-radius:24px; box-shadow:0 24px 70px rgba(0,0,0,.25); text-align:center; }
        .menu-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,2vw,20px); margin-top:24px; }
        .mode-btn { max-width:none; min-width:0; min-height:0; width:100%; padding:clamp(10px,2vw,22px);
            aspect-ratio:1/1; flex-direction:column; gap:12px; font-size:clamp(13px,1.8vw,18px);
            background:linear-gradient(145deg,#0b5275,#117e91); box-shadow:0 10px 22px rgba(11,82,117,.18); }
        .mode-btn .mode-icon { font-size:clamp(25px,5vw,42px); }
        .menu-subtitle { color:#637789; margin:8px 0 0; }
        .mode-management .form-grid { display:grid!important; }
        .mode-balance .form-grid { display:none!important; }
        .mode-promotion #page-balanco,.mode-balance #page-promocao,.mode-management #page-promocao { display:none!important; }
        .mode-promotion #page-promocao { display:block!important; }
        .mode-balance #page-balanco,.mode-management #page-balanco { display:block!important; }
        .mode-promotion #form-registro-balanco { display:none!important; }
        .mode-balance #btn-abrir-editar { display:none!important; }
        .top-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:12px; }
        .top-actions button { width:100px; min-width:86px; max-width:110px; min-height:0; aspect-ratio:1/1; }
        .loja-controls button { width:100%; max-width:125px; justify-self:center; }
        @media(max-width:560px) {
            .menu-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .menu-grid .mode-btn:last-child { grid-column:1 / -1; width:calc(50% - 5px); justify-self:center; }
            .manual-input-box { flex-wrap:wrap; }
            .manual-input-box input { flex:1 1 100%; }
            .manual-input-box .btn-action { flex:0 0 88px; }
            .auth-card { width:calc(100% - 28px); box-sizing:border-box; }
            .loja-controls { grid-template-columns:repeat(2,minmax(0,1fr)); }
        }


        .mode-promotion .header-card .loja-controls,
        .mode-promotion .header-card #loja-atual { display:none!important; }
        .mode-promotion .header-card { margin-bottom:14px; }
        .mode-promotion #page-promocao { display:block!important; }
        .mode-promotion #page-balanco { display:none!important; }
        .mode-balance .header-card .loja-controls,
        .mode-management .header-card .loja-controls { display:none!important; }
        .mode-balance .header-card #loja-atual,
        .mode-management .header-card #loja-atual { display:block!important; }
        .mode-balance #form-registro-balanco .form-grid { display:none!important; }
        .mode-management #form-registro-balanco .form-grid { display:grid!important; }

    </style>
</head>

    function escaparHTML(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function numero(v) {
        if (v === null || v === undefined || v === '') return 0;
        if (typeof v === 'number') return isFinite(v) ? v : 0;
        let s = String(v).trim().replace(/R\$\s?/gi, '').replace(/\s/g, '');
        if (s.includes(',') && s.includes('.')) {
            s = s.replace(/\./g, '').replace(',', '.');
        } else if (s.includes(',')) {
            s = s.replace(',', '.');
        }
        const n = Number(s);
        return isNaN(n) ? 0 : n;
    }
    function moeda(v) {
        const n = numero(v);
        return isNaN(n) || n === 0 ? 'R$ 0,00' : n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    }
    function tocarBip() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value=1000;
            gain.gain.setValueAtTime(.1,ctx.currentTime); osc.start(); osc.stop(ctx.currentTime+.1);
        } catch(e) {}
    }

    async function verificarPromocao(codigo) {
        const codStr = normalizarCodigo(codigo);
        if (!codStr) return { emPromocao: false, valorPromocao: null, promocoes: [] };

        const clientes = [];
        if (supabaseConsultaPromocoes) clientes.push(supabaseConsultaPromocoes);
        if (supabasePromocoes && !clientes.includes(supabasePromocoes)) clientes.push(supabasePromocoes);

        let ultimoErro = null;
        for (const cliente of clientes) {
            try {
                // Busca pelo código de barras em todas as lojas: sem filtro .eq('loja', ...).
                const { data, error } = await cliente
                    .from('promocoes')
                    .select('*')
                    .eq('codigo', codStr);

                if (error) { ultimoErro = error; console.error('Erro ao consultar promocoes:', error); continue; }

                const registros = (data || []).filter(item => {
                    const valor = item.valor_promocao ?? item.valor_promocional ??
                        item.preco_promocao ?? item.preco_promocional ?? item.valor ?? null;
                    const status = String(item.status ?? item.situacao ?? item.ativo ?? '').toLowerCase().trim();
                    const inativo = ['0','false','nao','não','inativo','inativa','off','cancelada','cancelado'].includes(status);
                    return !inativo && valor !== null && valor !== '' && numero(valor) > 0;
                });

                if (registros.length) {
                    // Exibe primeiro a promoção da loja selecionada, mas inclui as demais lojas.
                    registros.sort((x, y) =>
                        Number(String(y.loja ?? '').trim() === String(lojaSelecionada ?? '').trim()) -
                        Number(String(x.loja ?? '').trim() === String(lojaSelecionada ?? '').trim())
                    );
                    const principal = registros[0];
                    return {
                        emPromocao: true,
                        valorPromocao: principal.valor_promocao ?? principal.valor_promocional ??
                            principal.preco_promocao ?? principal.preco_promocional ?? principal.valor,
                        itemPromocao: principal,
                        promocoes: registros
                    };
                }
                return { emPromocao: false, valorPromocao: null, promocoes: [] };
            } catch (e) { ultimoErro = e; console.error('Falha ao consultar promoções:', e); }
        }
        if (ultimoErro) throw ultimoErro;
        return { emPromocao: false, valorPromocao: null, promocoes: [] };
    }

    async function buscarProdutoCompleto(codigo) {
        const codStr = normalizarCodigo(codigo);
        const lojaStr = String(lojaSelecionada ?? '').trim();

        if (!codStr) return { cadastro: null, estoque: [] };

        // Cadastro compartilhado: pesquisa pelo código de barras, sem filtrar por loja.
        let { data: cadastros, error: erroCadastro } = await supabaseBalanco
            .from('balanco_cadastro')
            .select('*')
            .eq('codigo', codStr)
            .limit(1);
        let cadastro = cadastros && cadastros.length ? cadastros[0] : null;

        if (erroCadastro) console.error("Erro ao buscar cadastro:", erroCadastro);

        let estoque = [];
        if (lojaStr) {
            const { data, error: erroEstoque } = await supabaseBalanco
                .from(tabelaBalancoSelecionada)
                .select('*')
                .eq('codigo', codStr)
                .eq('loja', lojaStr);
            if (erroEstoque) console.error("Erro ao buscar estoque:", erroEstoque);
            estoque = data || [];
        }

        const promoInfo = await verificarPromocao(codStr);

        if (cadastro) {
            if (promoInfo.emPromocao && promoInfo.valorPromocao) {
                cadastro.valor_promocao = promoInfo.valorPromocao;
            }
        } else if (promoInfo.emPromocao && promoInfo.itemPromocao) {
            cadastro = {
                codigo: codStr,
                descricao: promoInfo.itemPromocao.descricao || 'Produto em Promoção',
                valor: promoInfo.itemPromocao.valor_cadastro || promoInfo.itemPromocao.valor_normal || null,
                valor_promocao: promoInfo.valorPromocao,
                loja: lojaStr
            };
        }

        return { cadastro, estoque: estoque || [], promocao: promoInfo };
    }

    function htmlCadastroProduto(cadastro) {
        const valorNormal = cadastro ? cadastro.valor : null;
        const valorPromo = cadastro ? cadastro.valor_promocao : null;

        let precoHtml = `
            <div class="preco-cadastro-destaque">
                💰 Preço Cadastro: <strong>${moeda(valorNormal)}</strong>
            </div>`;

        if (valorPromo !== null && valorPromo !== undefined && valorPromo !== '' && numero(valorPromo) > 0) {
            precoHtml += `
                <div class="preco-promocional-vermelho">
                    🏷️ Preço Promoção: ${moeda(valorPromo)}
                </div>`;
        }

        return `
            <div class="product-title">${escaparHTML(cadastro.descricao)}</div>
            <div class="product-code">
                Código: ${escaparHTML(cadastro.codigo)}${lojaSelecionada ? ' | Loja: ' + escaparHTML(lojaSelecionada) : ''}
            </div>
            ${precoHtml}`;
    }

    function obterValorCampo(obj, nomes) {
        const chaves = Object.keys(obj || {});
        const normalizadas = nomes.map(n => String(n).toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, ''));
        const chave = chaves.find(k => {
            const nk = String(k).toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
            return normalizadas.includes(nk);
        });
        return chave ? obj[chave] : '';
    }

    function agruparQuantidade(rows, campo) {
        const mapa = new Map();
        rows.forEach(row => {
            let chave = String(obterValorCampo(row, campo) ?? '').trim();
            if (!chave) chave = 'Não informado';
            const qtd = Number(obterValorCampo(row, ['quantidade', 'qtd']) || 0);
            mapa.set(chave, (mapa.get(chave) || 0) + (isNaN(qtd) ? 0 : qtd));
        });
        return mapa;
    }

    function textoAgrupado(mapa) {
        if (!mapa || mapa.size === 0) return 'Não informado';
        return Array.from(mapa.entries()).map(([chave, qtd]) => `${chave}: ${qtd}`).join(' | ');
    }

    function resumoEstoqueHTML(rows) {
        const estoque = rows || [];
        const total = estoque.reduce((s, r) => s + (Number(obterValorCampo(r, ['quantidade', 'qtd'])) || 0), 0);

        const porBloco = agruparQuantidade(estoque, ['bloco']);
        const porLinha = agruparQuantidade(estoque, ['linha']);
        const porCaixa = agruparQuantidade(estoque, ['caixa_saco', 'caixa', 'saco']);

        return `
            <div class="estoque-grid">
                <div class="estoque-item"><small>Quantidade total</small><strong>${total}</strong></div>
                <div class="estoque-item"><small>Total por bloco</small><strong>${textoAgrupado(porBloco)}</strong></div>
                <div class="estoque-item"><small>Total por linha</small><strong>${textoAgrupado(porLinha)}</strong></div>
                <div class="estoque-item"><small>Total por caixa/saco</small><strong>${textoAgrupado(porCaixa)}</strong></div>
            </div>`;
    }

    function exibirStatusPromocao(resultadoPromo) {
        const box = document.getElementById('status-promocao');
        if (!box) return;

        if (resultadoPromo && resultadoPromo.emPromocao) {
            box.className = 'status-promocao status-promocao-em';
            const lista = resultadoPromo.promocoes || [resultadoPromo.itemPromocao].filter(Boolean);
            box.innerHTML = '<div style="font-weight:900;margin-bottom:8px;">🔥 ESTE PRODUTO ESTÁ EM PROMOÇÃO!</div>' +
                lista.map(item => {
                    const loja = item.loja !== undefined && item.loja !== null && String(item.loja).trim()
                        ? 'Loja ' + escaparHTML(item.loja) : 'Loja não informada';
                    const descricao = obterValorCampo(item, ['descricao','produto','nome']);
                    const codigo = obterValorCampo(item, ['codigo','codigo_barras','cod_barras','ean']);
                    const normal = obterValorCampo(item, ['valor_normal','valor_cadastro','preco_normal','preco']);
                    const promo = obterValorCampo(item, ['valor_promocao','valor_promocional','preco_promocao','preco_promocional','valor']);
                    const validade = obterValorCampo(item, ['validade','data_validade','fim_promocao','data_fim']);
                    return `<div style="text-align:left;background:#fff;padding:10px;margin:8px 0;border:1px solid #b7dfbf;border-radius:6px;">
                        <strong>Promoção para ${loja}</strong>
                        ${descricao ? `<div>Produto: ${escaparHTML(descricao)}</div>` : ''}
                        ${codigo ? `<div>Código de barras: ${escaparHTML(codigo)}</div>` : ''}
                        ${normal !== '' && normal !== null && normal !== undefined ? `<div>Preço normal: ${moeda(normal)}</div>` : ''}
                        ${promo !== '' && promo !== null && promo !== undefined ? `<div><strong>Preço promocional: ${moeda(promo)}</strong></div>` : ''}
                        ${validade ? `<div>Validade: ${escaparHTML(validade)}</div>` : ''}
                        <details><summary>Ver todos os dados da promoção</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;">${escaparHTML(JSON.stringify(item, null, 2))}</pre></details>
                    </div>`;
                }).join('');
        } else {
            box.className = 'status-promocao status-promocao-fora';
            box.innerHTML = '⚪ ESTE PRODUTO NÃO ESTÁ EM PROMOÇÃO.';
        }
    }

    async function buscarPorCodigoPromocao(codigoEscaneado) {
        if (!codigoEscaneado) { processandoLeituraPromocao = false; return; }

        const codigoTratado = normalizarCodigo(codigoEscaneado);
        document.getElementById('manual-code-promocao').value = codigoTratado;

        tocarBip();

        const resultBox = document.getElementById('result-box-promocao');
        const res = document.getElementById('res-conteudo-promocao');
        resultBox.style.display = 'block';
        
        const statusPromocao = document.getElementById('status-promocao');
        if (statusPromocao) { statusPromocao.className = ''; statusPromocao.innerHTML = ''; }
        res.innerHTML = '<div class="product-title">🔎 Consultando cadastro e promoção...</div>';

        try {
            const resultado = await buscarProdutoCompleto(codigoTratado);

            if (!resultado.cadastro) {
                resultBox.className = 'result-box not-found';
                res.innerHTML = `
                    <div class="product-title" style="color:#c62828;">Produto não encontrado</div>
                    <div class="product-code">
                        O código <strong>${escaparHTML(codigoTratado)}</strong> não foi encontrado no cadastro geral de produtos.
                    </div>`;
            } else {
                resultBox.className = 'result-box found';
                res.innerHTML = htmlCadastroProduto(resultado.cadastro) + 
                    (resultado.estoque.length > 0 ? resumoEstoqueHTML(resultado.estoque) : '');
            }
            
            exibirStatusPromocao(resultado.promocao);
        } catch (err) {
            console.error('Erro na consulta do produto:', err);
            resultBox.className = 'result-box not-found';
            res.innerHTML = `<div class="product-title" style="color:#c62828;">Erro na consulta</div><div class="product-code">${escaparHTML(err.message)}</div>`;
        } finally {
            setTimeout(() => processandoLeituraPromocao = false, 500);
        }
    }

                res.innerHTML = htmlCadastroProduto(data) + resumoEstoqueHTML(estoque);

                document.getElementById('btn-submit-balanco').innerText = 'Enviar para Balanço de Estoque';
                editBtn.style.display = 'block';

                document.getElementById('edit-descricao').value = data.descricao || '';
                document.getElementById('edit-valor').value = data.valor || '';
                document.getElementById('edit-valor-promocao').value = data.valor_promocao || '';
                document.getElementById('edit-quantidade').value = quantidadeEstoqueAtual;
            } else {
                produtoBalancoEncontrado = null;
                quantidadeEstoqueAtual = 0;

                resultBox.className = 'result-box not-found';
                res.innerHTML = `
                    <div class="product-title" style="color:#c62828;">PRODUTO NÃO ENCONTRADO NO CADASTRO GERAL</div>
                    <div class="product-code">
                        Código: <strong>${escaparHTML(codigoTratado)}</strong><br>
                        Loja de destino do balanço: <strong>${escaparHTML(lojaSelecionada)}</strong>.
                        Preencha as informações do produto abaixo.
                    </div>`;

                manual.style.display = 'block';
                document.getElementById('btn-submit-balanco').innerText = 'ENVIAR PARA CADASTRO E BALANÇO';
            }

            form.style.display = 'flex';
        } catch (err) {
            console.error('Erro na consulta do produto:', err);
            resultBox.style.display = 'block';
            resultBox.className = 'result-box not-found';
            res.innerHTML = `<div class="product-title" style="color:#c62828;">Erro na consulta</div><div class="product-code">${escaparHTML(err.message)}</div>`;
        } finally {
            processandoLeituraBalanco = false;
        }
    }

    function toggleEdicaoCadastro() {
        const b = document.getElementById('box-edicao-cadastro');
        b.style.display = (b.style.display === 'flex' || b.style.display === 'block') ? 'none' : 'flex';
    }

    async function salvarAlteracaoCadastro() {
        if (!exigirLoja()) return;
        const codigoInput = document.getElementById('manual-code-balanco').value.trim();
        const codigo = normalizarCodigo(codigoInput);
        const desc = document.getElementById('edit-descricao').value.trim();
        const valor = parseFloat(document.getElementById('edit-valor').value);
        const valorPromoInput = parseFloat(document.getElementById('edit-valor-promocao').value);
        const valorPromo = !isNaN(valorPromoInput) ? valorPromoInput : null;
        const qtd = parseInt(document.getElementById('edit-quantidade').value);
        
        if (!codigo || !desc || isNaN(valor) || valor <= 0) {
            alert('⚠️ Informe código, descrição e valor válidos.');
            return;
        }
        
        const codigoStr = String(produtoBalancoEncontrado ? produtoBalancoEncontrado.codigo : codigo).trim();
        const lojaStr = String(lojaSelecionada).trim();
        const operadorStr = String(operadorSelecionado).trim();
        
        try {
            const { error: e } = await supabaseBalanco.from('balanco_cadastro').update({ 
                descricao: desc, 
                valor: valor,
                valor_promocao: valorPromo,
                operador: operadorStr
            }).eq('codigo', codigoStr).eq('loja', lojaStr);
            
            if (e) throw e;
            
            if (!isNaN(qtd) && qtd >= 0) {
                const { data: rows, error: er } = await supabaseBalanco.from(tabelaBalancoSelecionada).select('id').eq('codigo', codigoStr).eq('loja', lojaStr);
                if (er) throw er;
                if (rows && rows.length) {
                    await supabaseBalanco.from(tabelaBalancoSelecionada).update({ quantidade: qtd, descricao: desc, valor: valor, valor_promocao: valorPromo, operador: operadorStr }).eq('id', rows[0].id);
                    for (let i = 1; i < rows.length; i++) await supabaseBalanco.from(tabelaBalancoSelecionada).update({ quantidade: 0, operador: operadorStr }).eq('id', rows[i].id);
                } else {
                    await supabaseBalanco.from(tabelaBalancoSelecionada).insert([{ codigo: codigoStr, loja: lojaStr, descricao: desc, tamanho: '', quantidade: qtd, valor: valor, valor_promocao: valorPromo, operador: operadorStr }]);
                }
            }
            alert('✅ Cadastro e estoque atualizados com sucesso!');
            buscarProdutoBalanco(codigo);
        } catch (err) {
            console.error(err);
            alert('❌ Falha ao alterar cadastro: ' + err.message);
        }
    }

    async function enviarParaBalancoEstoque() {
        if (!exigirLoja()) return;
        const codigoInput = document.getElementById('manual-code-balanco').value.trim();
        const codigoFormatado = normalizarCodigo(codigoInput);
        const tamanho = document.getElementById('bal-tamanho').value.trim();
        const bloco = document.getElementById('bal-bloco').value.trim();
        const linha = document.getElementById('bal-linha').value.trim();
        const caixaSaco = loteSacoCaixaSelecionado; 
        const operador = operadorSelecionado; 
        const quantidade = parseInt(document.getElementById('bal-quantidade').value) || 1;

        if (!codigoFormatado) { alert('⚠️ Código do produto inválido!'); return; }
        const codigoStr = String(produtoBalancoEncontrado ? produtoBalancoEncontrado.codigo : codigoFormatado).trim();
        const lojaStr = String(lojaSelecionada).trim();
        const operadorStr = String(operador).trim();
        
        let descricao = '', valor = 0, valorPromocao = null;
        if (produtoBalancoEncontrado) {
            descricao = produtoBalancoEncontrado.descricao;
            valor = produtoBalancoEncontrado.valor || 0;
            valorPromocao = produtoBalancoEncontrado.valor_promocao ?? null;
        } else {
            descricao = document.getElementById('bal-descricao-manual').value.trim();
            valor = parseFloat(document.getElementById('bal-valor-manual').value);
            const vpInput = parseFloat(document.getElementById('bal-valor-promocao-manual').value);
            valorPromocao = !isNaN(vpInput) ? vpInput : null;

            if (!descricao) { alert('⚠️ Descrição obrigatória!'); return; }
            if (isNaN(valor) || valor <= 0) { alert('⚠️ Valor inválido!'); return; }
            
            const { error } = await supabaseBalanco.from('balanco_cadastro').insert([{ 
                codigo: codigoStr, 
                loja: lojaStr, 
                descricao, 
                valor, 
                valor_promocao: valorPromocao,
                operador: operadorStr
            }]);
            if (error) { alert('❌ Falha ao cadastrar: ' + error.message); return; }
        }

        try {
            const blocoVal = bloco !== '' ? bloco : null;
            const linhaVal = linha !== '' ? linha : null;

            let query = supabaseBalanco.from(tabelaBalancoSelecionada).select('*')
                .eq('codigo', codigoStr)
                .eq('loja', lojaStr)
                .eq('tamanho', tamanho)
                .eq('caixa_saco', caixaSaco);

            if (blocoVal !== null) query = query.eq('bloco', blocoVal);
            else query = query.is('bloco', null);

            if (linhaVal !== null) query = query.eq('linha', linhaVal);
            else query = query.is('linha', null);

            let { data, error } = await query.maybeSingle();

            if (error) throw error;

            if (data) {
                const novaQtd = Number(data.quantidade || 0) + quantidade;
                const { error: e } = await supabaseBalanco.from(tabelaBalancoSelecionada).update({
                    quantidade: novaQtd,
                    descricao,
                    valor,
                    valor_promocao: valorPromocao,
                    tamanho,
                    bloco: blocoVal,
                    linha: linhaVal,
                    caixa_saco: caixaSaco,
                    operador: operadorStr
                }).eq('id', data.id);
                
                if (e) throw e;
                const localizacao = [
                    blocoVal ? `Bloco: ${blocoVal}` : '',
                    linhaVal ? `Linha: ${linhaVal}` : '',
                    caixaSaco ? `Caixa/Saco: ${caixaSaco}` : ''
                ].filter(Boolean).join(' | ');
                
                alert(`✅ +${quantidade} un. adicionadas! Total (${tamanho || 'Sem tamanho'}${localizacao ? ' | ' + localizacao : ''}): ${novaQtd}`);
            } else {
                const { error: e } = await supabaseBalanco.from(tabelaBalancoSelecionada).insert([{
                    codigo: codigoStr,
                    loja: lojaStr,
                    descricao,
                    tamanho,
                    bloco: blocoVal,
                    linha: linhaVal,
                    caixa_saco: caixaSaco,
                    quantidade,
                    valor,
                    valor_promocao: valorPromocao,
                    operador: operadorStr
                }]);
                if (e) throw e; 
                alert(`✅ Registrado com sucesso! Quantidade lançada: ${quantidade}`);
            }

            document.getElementById('result-box-balanco').style.display = 'none';
            document.getElementById('form-registro-balanco').style.display = 'none';
            document.getElementById('manual-code-balanco').value = '';
            
            if (scannerBalanco) { try { scannerBalanco.resume(); } catch(e){} }
            processandoLeituraBalanco = false;
        } catch (err) {
            console.error(err);
            alert('❌ Falha ao registrar no estoque: ' + err.message);
            if (scannerBalanco) { try { scannerBalanco.resume(); } catch(e){} }
            processandoLeituraBalanco = false;
        }
    }

    async function exportarBalancoExcel() {
        if (!exigirLoja()) return;
        try {
            const { data, error } = await supabaseBalanco.from(tabelaBalancoSelecionada).select('*').eq('loja', String(lojaSelecionada).trim());
            if (error) throw error;
            if (!data?.length) { alert('Nenhum dado encontrado para esta loja.'); return; }
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Balanço');
            XLSX.writeFile(wb, `Balanco_${tabelaBalancoSelecionada}_Loja_${lojaSelecionada}_${new Date().toISOString().slice(0,10)}.xlsx`);
        } catch (err) {
            console.error(err);
            alert('❌ Erro ao exportar: ' + err.message);
        }
    }

    function sairDoSistema() {
        if (confirm('Deseja realmente sair do sistema?')) {
            lojaSelecionada = null;
            operadorSelecionado = null;
            loteSacoCaixaSelecionado = null;
            tabelaBalancoSelecionada = 'Balanco_Juscelino';
            if (scannerPromocao) { try { scannerPromocao.clear(); } catch(e){} }
            if (scannerBalanco) { try { scannerBalanco.clear(); } catch(e){} }
            location.reload();
        }
    }

    document.getElementById('setup-loja').addEventListener('keydown', e => { if (e.key === 'Enter') confirmarSetupInicial(); });
    document.getElementById('setup-operador').addEventListener('keydown', e => { if (e.key === 'Enter') confirmarSetupInicial(); });
    document.getElementById('setup-lote').addEventListener('keydown', e => { if (e.key === 'Enter') confirmarSetupInicial(); });
    document.getElementById('input-identificador').addEventListener('keydown', e => { if (e.key === 'Enter') validarLogin(); });
    document.getElementById('input-senha').addEventListener('keydown', e => { if (e.key === 'Enter') validarLogin(); });
    document.getElementById('manual-code-promocao').addEventListener('keydown', e => { if (e.key === 'Enter') buscarPorCodigoPromocao(e.target.value); });
    document.getElementById('manual-code-balanco').addEventListener('keydown', e => { if (e.key === 'Enter') buscarProdutoBalanco(e.target.value); });
    </script>
