<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta e Balanço de Estoque</title> 
    
    <!-- Bibliotecas: Supabase, SheetJS e Html5-QRCode -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Modal de Autenticação */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-card {
            background: #ffffff; padding: 30px; border-radius: 15px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .auth-card h2 { color: #d32f2f; margin-top: 0; font-size: 22px; }
        .auth-card input {
            width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd;
            border-radius: 8px; font-size: 15px; text-align: left;
        }
        .auth-card button {
            width: 100%; padding: 12px; background: #d32f2f; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        .auth-card button:disabled { background: #ccc; cursor: not-allowed; }
        #auth-error { color: #c62828; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }

        /* Aplicação Principal */
        #main-app { display: none; max-width: 500px; width: 100%; }
        
        .container { background: #ffffff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #d32f2f; margin-top: 0; font-size: 24px; }
        
        /* Menu de Navegação */
        .nav-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: none; background-color: #e0e0e0; color: #333; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .nav-btn.active { background-color: #d32f2f; color: white; }

        #status-db { font-size: 13px; margin-bottom: 15px; padding: 10px; border-radius: 8px; font-weight: bold; }
        .loading { background: #fff3cd; color: #856404; }
        .ready { background: #d4edda; color: #155724; display: none; }
        .error { background: #f8d7da; color: #721c24; }

        .scanner-box { width: 100%; max-width: 400px; margin: 15px auto; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; background: #fafafa; }
        .scanner-box button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .scanner-box select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }

        .result-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; text-align: left; }
        .found { background-color: #e8f5e9; border-left: 6px solid #2e7d32; }
        .not-found { background-color: #ffebee; border-left: 6px solid #c62828; }
        .product-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .product-price { font-size: 32px; font-weight: 900; color: #e53935; margin-top: 5px; }
        .product-code { font-size: 12px; color: #777; }

        .manual-input { margin-top: 15px; display: flex; gap: 5px; }
        .manual-input input, .form-balanco input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .manual-input button, .form-balanco button { padding: 12px 18px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* Formulário de Balanço e Cadastro */
        .form-balanco { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 15px; }
        .form-balanco label { font-size: 13px; font-weight: bold; color: #555; }
        .btn-green { background-color: #28a745 !important; }
        .btn-excel { background-color: #17a2b8 !important; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 20px; }

        .suporte-box {
            margin-top: 30px; padding-top: 15px; border-top: 1px dashed #ccc;
            text-align: center; font-size: 13px; color: #555;
        }
        .suporte-box p { margin: 0 0 6px 0; font-weight: bold; color: #333; }
        .suporte-contatos { display: flex; flex-direction: column; gap: 5px; }
        .suporte-contatos span { color: #444; }
        
        .btn-sair {
            margin-top: 15px; width: 100%; padding: 12px;
            background-color: #7d6f6c; color: white; border: none;
            border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        .btn-sair:hover { background-color: #5f5452; }
    </style>
</head>
<body>

<!-- Tela de Autenticação Supabase -->
<div id="auth-overlay">
    <div class="auth-card">
        <h2>🔒 Acesso ao Sistema</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Informe suas credenciais para entrar.</p>
        
        <input type="text" id="input-identificador" placeholder="Usuário ou E-mail">
        <input type="password" id="input-senha" placeholder="Senha">
        
        <button id="btn-login" onclick="validarLogin()">Acessar Sistema</button>
        <div id="auth-error"></div>
    </div>
</div>

<!-- Interface Principal da Aplicação -->
<div id="main-app">
    <div class="container">
        <!-- Navegação de Páginas -->
        <div class="nav-menu">
            <button id="btn-tab-promocao" class="nav-btn active" onclick="trocarPagina('promocao')">🔥 Promoções</button>
            <button id="btn-tab-balanco" class="nav-btn" onclick="trocarPagina('balanco')">📦 Balanço</button>
        </div>

        <!-- ================= PÁGINA 1: PROMOÇÕES ================= -->
        <div id="page-promocao">
            <h1>🔥 CONSULTA PROMOÇÕES 🔥</h1>
            <h2>Wilian Software</h2>
            <div id="status-db" class="loading">Sincronizando produtos promocionais...</div>

            <div id="reader-promocao" class="scanner-box"></div>

            <div id="result-box-promocao" class="result-box">
                <div id="res-conteudo-promocao"></div>
            </div>

            <div class="manual-input">
                <input type="text" id="manual-code-promocao" placeholder="Digite o código de barras">
                <button onclick="buscarPorCodigoPromocao(document.getElementById('manual-code-promocao').value)">Buscar</button>
            </div>

            <button onclick="trocarPagina('balanco')" class="btn-navegar" style="margin-top: 15px; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                📦 Ir para Balanço de Estoque
            </button>
        </div>

        <!-- ================= PÁGINA 2: BALANÇO DE ESTOQUE ================= -->
        <div id="page-balanco" style="display: none;">
            <h1>📦 BALANÇO DE ESTOQUE</h1>
            <h2>Wilian Software</h2>

            <div id="reader-balanco" class="scanner-box"></div>

            <div class="manual-input">
                <input type="text" id="manual-code-balanco" placeholder="Código de barras">
                <button onclick="buscarProdutoBalanco(document.getElementById('manual-code-balanco').value)">Buscar</button>
            </div>

            <div id="result-box-balanco" class="result-box">
                <div id="res-conteudo-balanco"></div>
            </div>

            <!-- Formulário de Envio Rápido / Cadastro -->
            <div id="form-registro-balanco" class="form-balanco" style="display: none;">
                <div id="box-campos-manual" style="display: none;">
                    <div>
                        <label style="color: #c62828;">Descrição (Obrigatória para não cadastrados):</label>
                        <input type="text" id="bal-descricao-manual" placeholder="Digite a descrição do produto">
                    </div>
                    <div style="margin-top: 8px;">
                        <label style="color: #c62828;">Valor do produto (Obrigatório):</label>
                        <input type="number" step="0.01" id="bal-valor-manual" placeholder="Ex: 49.90">
                    </div>
                </div>
                <div>
                    <label>Tamanho do Produto (Opcional):</label>
                    <input type="text" id="bal-tamanho" placeholder="Ex: G, 42 (Pode deixar em branco)">
                </div>
                <div>
                    <label>Entrada (Padrão 1 por bip):</label>
                    <input type="number" id="bal-quantidade" value="1" min="1">
                </div>
                <button id="btn-submit-balanco" class="btn-green" onclick="enviarParaBalancoEstoque()">🚀 Enviar para Balanço de Estoque</button>
            </div>

            <!-- Botão de Exportação -->
            <button class="btn-excel" onclick="exportarBalancoExcel()">📊 Exportar Balanço em Excel (.xlsx)</button>
        </div>

        <button type="button" onclick="sairDoSistema()" class="btn-sair">🚪 Sair do Sistema</button>

        <!-- ÁREA DE SUPORTE -->
        <div class="suporte-box">
            <p>Precisa de suporte?</p>
            <div class="suporte-contatos">
                <span>📞 <strong>Telefone/WhatsApp:</strong> (37) 9 9846-8524</span>
                <span>✉️ <strong>E-mail:</strong> whrfreitas@gmail.com</span>
            </div>
        </div>
    </div>
</div>

<script>
    // BANCO 1: Promoções / Usuários
    const SUPABASE_URL_1 = 'https://sglmlcwzzjlrqthkmovq.supabase.co';
    const SUPABASE_KEY_1 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnbG1sY3d6empscnF0aGttb3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTU0MzEsImV4cCI6MjEwMTMzMTQzMX0.YtxgLeWrflL8EW7ye6ou0-ZyOpHAjud0z4XH7CYPS4w';
    const supabasePromocoes = supabase.createClient(SUPABASE_URL_1, SUPABASE_KEY_1);

    // BANCO 2: Balanço de Estoque
    const SUPABASE_URL_2 = 'https://lqoqvbtvmzivmsugyzxz.supabase.co';
    const SUPABASE_KEY_2 = 'sb_publishable_kyXiNrX0IOMAF6ozR2FuxA_hMQVhhov';
    const supabaseBalanco = supabase.createClient(SUPABASE_URL_2, SUPABASE_KEY_2);

    let bancoDadosProdutos = [];
    let scannerPromocao = null;
    let scannerBalanco = null;
    let produtoBalancoEncontrado = null;

    const statusDb = document.getElementById('status-db');

    // Troca de Aba com Liberação da Câmera
    async function trocarPagina(aba) {
        if (scannerPromocao) {
            try { await scannerPromocao.clear(); } catch (e) {}
            scannerPromocao = null;
        }
        if (scannerBalanco) {
            try { await scannerBalanco.clear(); } catch (e) {}
            scannerBalanco = null;
        }

        document.getElementById('page-promocao').style.display = aba === 'promocao' ? 'block' : 'none';
        document.getElementById('page-balanco').style.display = aba === 'balanco' ? 'block' : 'none';
        
        document.getElementById('btn-tab-promocao').className = aba === 'promocao' ? 'nav-btn active' : 'nav-btn';
        document.getElementById('btn-tab-balanco').className = aba === 'balanco' ? 'nav-btn active' : 'nav-btn';

        setTimeout(() => {
            if (aba === 'promocao') {
                iniciarScannerPromocao();
            } else if (aba === 'balanco') {
                iniciarScannerBalanco();
            }
        }, 100);
    }

    // Autenticação
    async function validarLogin() {
        const identificador = document.getElementById('input-identificador').value.trim();
        const senha = document.getElementById('input-senha').value.trim();
        const authError = document.getElementById('auth-error');
        const btnLogin = document.getElementById('btn-login');

        authError.style.display = 'none';

        if (!identificador || !senha) {
            authError.innerText = '⚠️ Preencha o usuário/e-mail e a senha!';
            authError.style.display = 'block';
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerText = 'Verificando...';

        try {
            let { data, error } = await supabasePromocoes
                .from('usuarios')
                .select('*')
                .eq('usuario', identificador)
                .eq('senha', senha)
                .maybeSingle();

            if (!data && !error) {
                const resultEmail = await supabasePromocoes
                    .from('usuarios')
                    .select('*')
                    .eq('e-mail', identificador)
                    .eq('senha', senha)
                    .maybeSingle();

                data = resultEmail.data;
                error = resultEmail.error;
            }

            if (error) throw error;

            if (!data) {
                authError.innerText = '❌ Usuário, e-mail ou senha incorretos.';
                authError.style.display = 'block';
            } else if (data.situacao_acesso && data.situacao_acesso.toLowerCase() === 'off') {
                authError.innerText = '🚫 Acesso suspenso ou inativo.';
                authError.style.display = 'block';
            } else {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                carregarPlanilhaExcelAutomatico();
                iniciarScannerPromocao();
            }
        } catch (err) {
            console.error("Erro na consulta do banco:", err);
            authError.innerText = '❌ Erro de conexão com o banco de dados.';
            authError.style.display = 'block';
        } finally {
            btnLogin.disabled = false;
            btnLogin.innerText = 'Acessar Sistema';
        }
    }

    // PÁGINA 1: CONSULTA PROMOÇÕES
    async function carregarPlanilhaExcelAutomatico() {
        try {
            const response = await fetch('./produtos.xlsx?v=' + new Date().getTime());
            if (!response.ok) throw new Error("Status: " + response.status);
            
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const primeiraAba = workbook.SheetNames[0];
            const planilhaJson = XLSX.utils.sheet_to_json(workbook.Sheets[primeiraAba]);

            bancoDadosProdutos = planilhaJson.map(item => {
                const buscarColuna = (termos) => {
                    const chaveReal = Object.keys(item).find(k => 
                        termos.includes(k.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, ""))
                    );
                    return chaveReal ? String(item[chaveReal]).trim() : '';
                };

                return {
                    codigo: buscarColuna(['codigo', 'cod', 'barcode', 'codigo de barras']),
                    descricao: buscarColuna(['descricao', 'nome', 'produto', 'item']),
                    preco: buscarColuna(['preco', 'valor', 'venda', 'promocao'])
                };
            }).filter(p => p.codigo !== '');

            if (statusDb) statusDb.className = "ready";

        } catch (err) {
            console.error("Erro detalhado:", err);
            if (statusDb) {
                statusDb.className = 'error';
                statusDb.innerHTML = '❌ Falha ao carregar produtos.xlsx.';
            }
        }
    }

    function buscarPorCodigoPromocao(codigoEscaneado) {
        if (!codigoEscaneado || bancoDadosProdutos.length === 0) return;
        
        const normalizar = (str) => String(str || '').trim().replace(/^0+/, '');
        const codigoLimpo = normalizar(codigoEscaneado);
        const produto = bancoDadosProdutos.find(p => normalizar(p.codigo) === codigoLimpo);

        const resultBox = document.getElementById('result-box-promocao');
        const resConteudo = document.getElementById('res-conteudo-promocao');
        resultBox.style.display = "block";

        if (produto) {
            resultBox.className = "result-box found";
            const valorNumerico = parseFloat(String(produto.preco).replace(',', '.'));
            const precoFormatado = isNaN(valorNumerico) 
                ? produto.preco 
                : valorNumerico.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            
            resConteudo.innerHTML = `
                <div class="product-title">${produto.descricao}</div>
                <div class="product-code">Cód: ${produto.codigo}</div>
                <div style="font-size: 14px; margin-top:10px; color:#555;">Preço de Promoção:</div>
                <div class="product-price">${precoFormatado}</div>
            `;
            tocarBip();
        } else {
            resultBox.className = "result-box not-found";
            resConteudo.innerHTML = `
                <div class="product-title" style="color: #c62828;">Produto não cadastrado</div>
                <div class="product-code">O código <strong>${codigoEscaneado}</strong> não está em promoção.</div>
            `;
        }
    }

    function iniciarScannerPromocao() {
        if (scannerPromocao) return;
        scannerPromocao = new Html5QrcodeScanner("reader-promocao", { fps: 15, qrbox: { width: 280, height: 120 } }, false);
        scannerPromocao.render((decodedText) => {
            document.getElementById('manual-code-promocao').value = decodedText;
            buscarPorCodigoPromocao(decodedText);
        });
    }

    // PÁGINA 2: BALANÇO DE ESTOQUE
    function iniciarScannerBalanco() {
        if (scannerBalanco) return;
        scannerBalanco = new Html5QrcodeScanner("reader-balanco", { fps: 15, qrbox: { width: 280, height: 120 } }, false);
        scannerBalanco.render((decodedText) => {
            document.getElementById('manual-code-balanco').value = decodedText;
            buscarProdutoBalanco(decodedText);
        });
    }

    async function buscarProdutoBalanco(codigo) {
        if (!codigo) return;

        const resultBox = document.getElementById('result-box-balanco');
        const resConteudo = document.getElementById('res-conteudo-balanco');
        const formRegistro = document.getElementById('form-registro-balanco');
        const boxCamposManual = document.getElementById('box-campos-manual');
        const btnSubmit = document.getElementById('btn-submit-balanco');

        resultBox.style.display = "none";
        formRegistro.style.display = "none";
        boxCamposManual.style.display = "none";
        document.getElementById('bal-tamanho').value = '';
        document.getElementById('bal-quantidade').value = 1;
        document.getElementById('bal-descricao-manual').value = '';
        document.getElementById('bal-valor-manual').value = '';

        try {
            const { data, error } = await supabaseBalanco
                .from('balanco_cadastro')
                .select('*')
                .eq('codigo', codigo.trim())
                .maybeSingle();

            if (error) throw error;

            resultBox.style.display = "block";

            if (data) {
                produtoBalancoEncontrado = data;
                resultBox.className = "result-box found";
                resConteudo.innerHTML = `
                    <div class="product-title">${produtoBalancoEncontrado.descricao}</div>
                    <div class="product-code">Código: ${produtoBalancoEncontrado.codigo}</div>
                `;
                btnSubmit.innerText = "Enviar para Balanço de Estoque";
                tocarBip();
            } else {
                produtoBalancoEncontrado = null;
                resultBox.className = "result-box not-found";
                resConteudo.innerHTML = `
                    <div class="product-title" style="color: #c62828;">PRODUTO NÃO CADASTRADO NO BALANÇO</div>
                    <div class="product-code">Preencha as informações do produto abaixo.</div>
                `;
                boxCamposManual.style.display = "block";
                btnSubmit.innerText = "ENVIAR PARA CADASTRO E BALANÇO";
            }

            formRegistro.style.display = "flex";

        } catch (err) {
            console.error("Erro ao buscar em balanco_cadastro:", err);
            alert("Erro ao consultar balanco_cadastro: " + err.message);
        }
    }

    async function enviarParaBalancoEstoque() {
        const codigo = document.getElementById('manual-code-balanco').value.trim();
        const tamanho = document.getElementById('bal-tamanho').value.trim();
        const quantidadeInput = document.getElementById('bal-quantidade').value;
        const quantidade = parseInt(quantidadeInput) || 1;

        if (!codigo) {
            alert("⚠️ Código do produto inválido!");
            return;
        }

        let descricao = "";
        let valor = 0;
        let valorPromocao = null;

        if (produtoBalancoEncontrado) {
            descricao = produtoBalancoEncontrado.descricao;
            valor = produtoBalancoEncontrado.valor || 0;
            valorPromocao = produtoBalancoEncontrado.valor_promocao || null;
        } else {
            // Se o produto for novo, faz as validações obrigatórias
            descricao = document.getElementById('bal-descricao-manual').value.trim();
            const valorInput = document.getElementById('bal-valor-manual').value;
            valor = parseFloat(valorInput);

            if (!descricao) {
                alert("⚠️ Descrição (Obrigatória para não cadastrados) não preenchida!");
                return;
            }
            if (isNaN(valor) || valor <= 0) {
                alert("⚠️ Valor do produto (Obrigatório) é inválido ou não foi informado!");
                return;
            }

            // Cadastra automaticamente na tabela balanco_cadastro
            try {
                const { error: insertCadErr } = await supabaseBalanco
                    .from('balanco_cadastro')
                    .insert([{
                        codigo: codigo,
                        descricao: descricao,
                        valor: valor
                    }]);

                if (insertCadErr) throw insertCadErr;
            } catch (errCad) {
                console.error("Erro ao salvar cadastro do produto:", errCad);
                alert("❌ Falha ao cadastrar o produto em balanco_cadastro: " + errCad.message);
                return;
            }
        }

        // Lança a contagem no estoque
        try {
            const { data, error } = await supabaseBalanco
                .from('balanco_estoque')
                .select('*')
                .eq('codigo', codigo)
                .eq('tamanho', tamanho)
                .maybeSingle();

            if (error) throw error;

            if (data) {
                const novaQtd = Number(data.quantidade || 0) + quantidade;

                const { error: updateErr } = await supabaseBalanco
                    .from('balanco_estoque')
                    .update({ 
                        quantidade: novaQtd,
                        valor: valor,
                        valor_promocao: valorPromocao
                    })
                    .eq('id', data.id);

                if (updateErr) throw updateErr;
                alert(`✅ +${quantidade} un. adicionadas! Total acumulado (${tamanho || 'Sem Tamanho'}): ${novaQtd}`);
            } else {
                const { error: insertErr } = await supabaseBalanco
                    .from('balanco_estoque')
                    .insert([{
                        codigo: codigo,
                        descricao: descricao,
                        tamanho: tamanho,
                        quantidade: quantidade,
                        valor: valor,
                        valor_promocao: valorPromocao
                    }]);

                if (insertErr) throw insertErr;
                alert(`✅ Registrado com sucesso! Quantidade lançada: ${quantidade}`);
            }

            // Reseta a interface
            document.getElementById('result-box-balanco').style.display = "none";
            document.getElementById('form-registro-balanco').style.display = "none";
            document.getElementById('manual-code-balanco').value = "";
            document.getElementById('bal-quantidade').value = "1";
            produtoBalancoEncontrado = null;

        } catch (err) {
            console.error("Erro ao enviar para balanco_estoque:", err);
            alert("❌ Erro ao enviar produto: " + err.message);
        }
    }

    async function exportarBalancoExcel() {
        try {
            const { data, error } = await supabaseBalanco
                .from('balanco_estoque')
                .select('codigo, descricao, tamanho, quantidade, created_at');

            if (error) throw error;

            if (!data || data.length === 0) {
                alert("⚠️ Nenhum registro encontrado no balanço de estoque para exportar.");
                return;
            }

            const dadosFormatados = data.map(item => ({
                'Código de Barras': item.codigo,
                'Descrição': item.descricao,
                'Tamanho': item.tamanho || 'N/A',
                'Quantidade Contada': item.quantidade,
                'Data do Registro': item.created_at ? new Date(item.created_at).toLocaleString('pt-BR') : ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(dadosFormatados);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Balanço Realizado");

            const dataAtual = new Date().toISOString().slice(0,10);
            XLSX.writeFile(workbook, `Balanco_Estoque_${dataAtual}.xlsx`);

        } catch (err) {
            console.error("Erro ao exportar:", err);
            alert("❌ Falha ao exportar relatório em Excel: " + err.message);
        }
    }

    function tocarBip() {
        try {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            osc.type = "sine";
            osc.frequency.value = 900;
            osc.connect(context.destination);
            osc.start();
            setTimeout(() => osc.stop(), 80);
        } catch(e) {}
    }

    async function sairDoSistema() {
        if (scannerPromocao) {
            try { await scannerPromocao.clear(); } catch(e){}
            scannerPromocao = null;
        }
        if (scannerBalanco) {
            try { await scannerBalanco.clear(); } catch(e){}
            scannerBalanco = null;
        }

        bancoDadosProdutos = [];
        document.getElementById('main-app').style.display = 'none';
        document.getElementById('auth-overlay').style.display = 'flex';
        document.getElementById('input-identificador').value = '';
        document.getElementById('input-senha').value = '';
    }

    document.getElementById('input-senha').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') validarLogin();
    });
    document.getElementById('input-identificador').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') validarLogin();
    });
</script>
